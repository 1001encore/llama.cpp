name: Sniper-MTP-Build

on:
  workflow_dispatch:

jobs:
  windows-cuda-mtp:
    runs-on: windows-2019  # Downgraded to bypass the VS 2022 installer freeze
    
    steps:
      - name: Force Clone MTP Branch
        uses: actions/checkout@v4
        with:
          ref: mtp-clean
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA 13.1
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '13.1.0'

      - name: Install Ninja
        run: choco install ninja

      - name: Build MTP Server
        run: |
          cmake -S . -B build `
            -G "Ninja" `
            -D CMAKE_C_COMPILER=cl `
            -D CMAKE_CXX_COMPILER=cl `
            -D GGML_CUDA=ON `
            -D LLAMA_BUILD_SERVER=ON `
            -D CMAKE_BUILD_TYPE=Release `
            -D GGML_CUDA_F16=ON
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-mtp-win-cuda13.1
          path: build/bin/
